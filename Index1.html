<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    h1 {
      margin-bottom: 20px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-gap: 5px;
      justify-content: center;
    }
    .cell {
      width: 100px;
      height: 100px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      cursor: pointer;
    }
    .cell:hover {
      background: #ddd;
    }
    #message {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>Tic Tac Toe</h1>
  <div id="board"></div>
  <div id="message"></div>

  <script>
    const board = [
      ["", "", ""],
      ["", "", ""],
      ["", "", ""]
    ];
    let currentPlayer = "X";
    const boardDiv = document.getElementById("board");
    const messageDiv = document.getElementById("message");

    function renderBoard() {
      boardDiv.innerHTML = "";
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.textContent = board[i][j];
          cell.addEventListener("click", () => handleMove(i, j));
          boardDiv.appendChild(cell);
        }
      }
    }

    function handleMove(row, col) {
      if (board[row][col] !== "" || checkWin("X") || checkWin("O")) {
        return;
      }
      board[row][col] = currentPlayer;
      renderBoard();

      if (checkWin(currentPlayer)) {
        messageDiv.textContent = `Player ${currentPlayer} wins!`;
      } else if (checkDraw()) {
        messageDiv.textContent = "It's a draw!";
      }
